name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      # Pinned: the runner's apt shellcheck is older and flags SC2317 on
      # indirectly invoked functions. Bump together with the local tool.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          SUDO=""
          [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO=sudo
          command -v xz >/dev/null || { $SUDO apt-get update && $SUDO apt-get install -y xz-utils; }
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | $SUDO tar -xJ -C /usr/local/bin --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: make check
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make check

      # Dispatched runs (imported claude/* branches) get no commit status from Forgejo,
      # and the merge rule reads that status.
      - name: Report status for dispatched runs
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          STATE: ${{ job.status }}
          SHA: ${{ github.sha }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$STATE" = success ] || STATE=failure
          curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"state\":\"$STATE\",\"context\":\"ci / check (dispatch)\"}" "$API/statuses/$SHA"
