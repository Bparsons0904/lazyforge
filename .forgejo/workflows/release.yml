name: release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and verifies the archives under the given version, never publishes.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the dry-run archives
        default: v0.0.0-dryrun

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a tag on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: ./.forgejo/actions/setup

      - name: make release
        run: make release VERSION="$RELEASE_VERSION"

      # Reusing these archives means the ones published are the ones the installer tests verified.
      - name: make check
        env:
          TEST_INSTALL_REUSE_DIST: "1"
          TEST_INSTALL_VERSION: ${{ env.RELEASE_VERSION }}
        run: make check

      - name: Publish
        if: github.event_name == 'push'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
        run: scripts/publish-release.sh "$RELEASE_VERSION"
