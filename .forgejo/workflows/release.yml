name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Require a tag on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      # Pinned: the runner's apt shellcheck is older and flags SC2317 on
      # indirectly invoked functions. Bump together with the local tool.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          SUDO=""
          [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO=sudo
          command -v xz >/dev/null || { $SUDO apt-get update && $SUDO apt-get install -y xz-utils; }
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | $SUDO tar -xJ -C /usr/local/bin --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: make check
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make check

      - name: make release
        run: make release VERSION="$GITHUB_REF_NAME"

      - name: Publish
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
        run: scripts/publish-release.sh "$GITHUB_REF_NAME"
